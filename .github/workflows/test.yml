name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python scripts/benchmark_offline.py
      - run: uv build --wheel
      - run: uv run --locked python scripts/check_wheel.py dist
