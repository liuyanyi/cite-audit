name: Validate greenfield application
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matched: ${{ steps.paths.outputs.changes }}
      pytest: ${{ steps.paths.outputs.pytest }}
      lint: ${{ steps.paths.outputs.lint }}
      frontend: ${{ steps.paths.outputs.frontend }}
      ui_tests: ${{ steps.paths.outputs.ui_tests }}
      api_test: ${{ steps.paths.outputs.api_test }}
      wheel: ${{ steps.paths.outputs.wheel }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: paths
        with:
          base: ${{ github.ref_name }}
          filters: |
            config: &config
              - '.github/workflows/test.yml'
            backend: &backend
              - *config
              - 'cite_audit/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
            pytest:
              - *backend
              - 'tests/**'
            lint:
              - *config
              - '{cite_audit,tests,scripts}/**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
            frontend: &frontend
              - *config
              - 'frontend/src/!(test)/**'
              - 'frontend/src/*.*'
              - 'frontend/public/**'
              - 'frontend/*.{html,json,ts,js,mjs,cjs}'
              - 'frontend/.npmrc'
            ui_tests:
              - *frontend
              - 'frontend/src/test/!(api-workflow.test.tsx|sse-client.ts)'
            api_test:
              - *backend
              - *frontend
              - 'frontend/src/test/{api-workflow.test.tsx,sse-client.ts,setup.ts}'
            wheel:
              - *config
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/check_wheel.py'
              - 'frontend/{vite.config.ts,package.json,package-lock.json,index.html}'
              - 'cite_audit/{__init__,cli}.py'

  test:
    needs: changes
    if: needs.changes.outputs.matched != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((needs.changes.outputs.pytest == 'true' || needs.changes.outputs.api_test == 'true' || needs.changes.outputs.wheel == 'true') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      BACKEND_TESTS: ${{ needs.changes.outputs.pytest }}
      UI_TESTS: ${{ needs.changes.outputs.ui_tests }}
      API_TEST: ${{ needs.changes.outputs.api_test }}
      WHEEL: ${{ needs.changes.outputs.wheel == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: env.BACKEND_TESTS == 'true' || env.API_TEST == 'true' || env.WHEEL == 'true' || needs.changes.outputs.lint == 'true'
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
        if: env.BACKEND_TESTS == 'true' || env.API_TEST == 'true' || env.WHEEL == 'true'
      - run: uv run --locked ruff check cite_audit tests scripts
        if: needs.changes.outputs.lint == 'true' && runner.os == 'Linux'
      - run: uv run --locked pytest
        if: env.BACKEND_TESTS == 'true'
      - uses: actions/setup-node@v4
        if: env.UI_TESTS == 'true' || env.API_TEST == 'true' || env.WHEEL == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: env.UI_TESTS == 'true' || env.API_TEST == 'true' || env.WHEEL == 'true'
        working-directory: frontend
      - run: npm run typecheck
        if: runner.os == 'Linux' && needs.changes.outputs.frontend != 'true' && env.WHEEL != 'true' && (env.UI_TESTS == 'true' || env.API_TEST == 'true')
        working-directory: frontend
      - run: npm test -- --exclude src/test/api-workflow.test.tsx
        if: env.UI_TESTS == 'true' && runner.os == 'Linux'
        working-directory: frontend
      - run: npm test -- src/test/api-workflow.test.tsx
        if: env.API_TEST == 'true'
        working-directory: frontend
      # The build script also typechecks the frontend.
      - run: npm run build
        if: (needs.changes.outputs.frontend == 'true' && runner.os == 'Linux') || env.WHEEL == 'true'
        working-directory: frontend
      - run: uv build --wheel
        if: env.WHEEL == 'true'
      - run: uv run --locked python scripts/check_wheel.py dist
        if: env.WHEEL == 'true'
